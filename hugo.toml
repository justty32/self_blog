baseURL = "https://justty32.github.io/self_blog/"
title = "justty32"
locale = "zh-Hant-TW"
timeZone = "Asia/Taipei"
hasCJKLanguage = true
publishDir = "public"
relativeURLs = false
canonifyURLs = false
noBuildLock = true
enableRobotsTXT = true

[params]
  description = "程式、工具與日常實作筆記。"
  socialImage = "social-preview.jpg"
  socialImageAlt = "深藍色開發者工作空間與青綠色數位線條插畫"

[permalinks.page]
  posts = "/posts/:year/:contentbasename/"

[outputs]
  home = ["html", "rss"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]
  page = ["html"]

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  codeFences = true
  guessSyntax = false
  noClasses = false

[security.exec]
  allow = []
  osEnv = []

[security.funcs]
  getenv = []

[security.http]
  urls = []
  methods = []

# Main navigation; pageRef follows Hugo page routes.
[[menus.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 10

[[menus.main]]
  name = "標籤"
  pageRef = "/tags"
  weight = 20

[[menus.main]]
  name = "月份"
  pageRef = "/archive"
  weight = 30

[[menus.main]]
  name = "關於"
  pageRef = "/about"
  weight = 40

[[menus.main]]
  name = "聯絡"
  pageRef = "/contact"
  weight = 50
