name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Hugo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .hugo-tool-cache
          key: ${{ runner.os }}-hugo-165-${{ hashFiles('scripts/Hugo-165.psd1') }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify workflow snapshot
        shell: pwsh
        run: ./scripts/verify-workflow-snapshot.ps1

      - name: Test workflow snapshot checks
        shell: pwsh
        run: ./scripts/test-workflow-snapshot.ps1

      - name: Test automation scripts
        shell: pwsh
        run: ./scripts/test-automation.ps1

      - name: Test site validation
        shell: pwsh
        run: ./scripts/test-site-validation.ps1

      - name: Test appearance interactions
        run: node scripts/test-appearance.cjs

      - name: Build and verify
        shell: pwsh
        run: ./scripts/verify.ps1 -ToolCacheRoot '${{ github.workspace }}/.hugo-tool-cache'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
