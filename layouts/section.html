{{ define "main" }}
<header class="page-header">
  <p class="eyebrow">Collection</p>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
</header>
<div class="post-list">
  {{ range .Pages.ByDate.Reverse }}{{ partial "post-card.html" . }}{{ else }}<p class="empty">目前沒有內容。</p>{{ end }}
</div>
{{ end }}
