{{ define "main" }}
<article>
  <header class="page-header">
    <p class="eyebrow">Post</p>
    <h1>{{ .Title }}</h1>
    <p class="page-description">{{ .Description }}</p>
    <div class="meta">
      <a href="{{ printf "archive/#%s" (.Date.Format "2006-01") | relURL }}"><time datetime="{{ .Date.Format "2006-01-02" }}">發布於 {{ .Date.Format "2006-01-02" }}</time></a>
      {{ if ne .Lastmod .Date }}<time datetime="{{ .Lastmod.Format "2006-01-02" }}">更新於 {{ .Lastmod.Format "2006-01-02" }}</time>{{ end }}
    </div>
    {{ with .GetTerms "tags" }}
    <ul class="tags" aria-label="標籤">
      {{ range . }}<li><a class="tag" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a></li>{{ end }}
    </ul>
    {{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
