<header class="site-header">
  <nav class="site-shell nav" aria-label="主要導覽">
    <a class="brand" href="{{ "" | relURL }}"><span class="brand-mark" aria-hidden="true">j.</span><span class="brand-label">{{ .Site.Title }}</span></a>
    <ul class="nav-links">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
    {{ partial "appearance.html" . }}
  </nav>
</header>
